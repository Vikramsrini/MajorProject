[project]
name = "er-research"
version = "0.1.0"
description = "Attribute-aware and confidence-aware entity resolution for e-commerce product matching"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "rapidfuzz>=3.6",
    "jellyfish>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "torch>=2.2"]
# Fine-tuning a cross-encoder (scripts/run_wdc.py --with-crossencoder). sentencepiece
# is required on transformers v5 even for byte-vocabulary models when a checkpoint has
# no fast tokenizer, and its absence fails only after data download on a rented GPU.
finetune = ["transformers>=4.40", "sentencepiece>=0.1.99", "torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
